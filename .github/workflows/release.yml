name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Required to publish provenance attestations for the pushed image.
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.25"
  IMAGE: dougeubanks/gmc-exporter

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A tag must never publish something that would have failed CI.
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Authentication uses a scoped access token, never an account password.
      # A token can be given write-only scope and revoked independently.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Exact version, minor, major, and latest. A deployment can pin to
          # whichever level of churn it is willing to accept.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=gmc-exporter
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
            ```

            Digest: `${{ steps.push.outputs.digest }}`

            Platforms: `linux/amd64`, `linux/arm64`
