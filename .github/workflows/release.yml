name: Release

# Releases happen automatically on merge to main.
#
# Versioning, tagging and publishing all live in this one workflow, which is
# deliberate rather than tidy. GitHub does not trigger workflows from events
# caused by GITHUB_TOKEN: a bot that opened a release pull request would never
# see the required status checks run, and a bot that pushed a tag would never
# trigger a separate build workflow. Splitting the work would therefore require
# a personal access token. Doing it in one job requires no extra credential.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  # Never run two releases at once. A second merge waits rather than racing for
  # the same version number.
  group: release
  cancel-in-progress: false

env:
  IMAGE: dougeubanks/gmc-exporter
  GO_VERSION: "1.25"

jobs:
  decide:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: decide
        env:
          FORCED: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$last" ]; then
            echo "No previous tag; starting at v0.1.0"
            {
              echo "release=true"
              echo "version=v0.1.0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last tag: $last"

          range="${last}..HEAD"
          if [ -z "$(git log --oneline "$range")" ]; then
            echo "Nothing new since $last"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commits=$(git log --format='%s%n%b' "$range")
          files=$(git diff --name-only "$range")

          # A release exists to ship a binary. If nothing outside documentation
          # changed then the binary is byte-identical, and a new version number
          # would be saying something untrue about it.
          code=$(printf '%s\n' "$files" | grep -vE '^(docs/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' || true)
          if [ -z "$code" ] && [ -z "${FORCED:-}" ]; then
            echo "Documentation only; no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_core=${last#v}
          major=${version_core%%.*}
          rest=${version_core#*.}
          minor=${rest%%.*}
          patch=${version_core##*.}

          if [ -n "${FORCED:-}" ]; then
            bump="$FORCED"
          elif printf '%s' "$commits" | grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            bump=major
          elif printf '%s' "$commits" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          else
            # Prose commit subjects are normal here, so anything touching code
            # is a patch unless a commit explicitly says otherwise.
            bump=patch
          fi
          echo "Bump: $bump"

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          version="v${major}.${minor}.${patch}"
          echo "Next version: $version"
          {
            echo "release=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Nothing is published that would have failed CI.
      - run: go vet ./...
      - run: go test -race ./...

      - name: Create the tag
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.decide.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.decide.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.decide.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=gmc-exporter
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.decide.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.decide.outputs.version }}
          name: ${{ needs.decide.outputs.version }}
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ needs.decide.outputs.version }}
            ```

            Digest: `${{ steps.push.outputs.digest }}`

            Platforms: `linux/amd64`, `linux/arm64`
