# Dependency updates run weekly on Friday morning, local time.
#
# Friday is deliberate: an update that needs attention lands with a working day
# left to deal with it, rather than arriving on a Saturday or sitting unseen
# until Monday. The time is given with a timezone so it does not drift by an
# hour twice a year the way a fixed UTC cron would.
#
# Patch and minor updates merge themselves once CI passes, and security updates
# merge at any level. See .github/workflows/dependabot-auto-merge.yml.

version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Grouped so a coordinated OpenTelemetry release arrives as one
      # reviewable pull request instead of eight that must be merged together.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "docker"
